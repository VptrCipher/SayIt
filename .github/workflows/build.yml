name: Build Desktop App

on:
  push:
    branches: [main]
    tags:
      - "v*"          # Release build runs on a version tag; builds the TAGGED commit.
  release:
    types: [created]  # Also build if a release is created from a tag.
  workflow_dispatch:  # Allow manual triggering

env:
  APP_NAME: SayIt
  # Raw tag ref name on a version tag (e.g. "v0.1.0"); "0.1.0" otherwise.
  # The leading "v" is stripped in the steps that need a bare version
  # (Briefcase build + AppImage filename) so the Linux asset is named
  # SayIt-0.1.0-Linux-x86_64.AppImage.
  # For tag pushes, use that tag. For the one-time release commit on main,
  # this is the new patch release being prepared.
  APP_VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'v0.1.1' }}

jobs:
  # ============================================================================
  # Test - Run tests before building
  # ============================================================================
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.ref }}
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        
    - name: Install uv
      uses: astral-sh/setup-uv@v7

    - name: Restore uv cache
      uses: actions/cache@v4
      with:
        path: ~/.cache/uv
        key: uv-${{ runner.os }}-${{ hashFiles('uv.lock') }}
        restore-keys: |
          uv-${{ runner.os }}-
      
    - name: Install system dependencies for Qt
      run: |
        sudo apt-get update
        sudo apt-get install -y libegl1 libegl-dev libxkbcommon0 libxcb-xinerama0 libxcb-cursor0 libportaudio2

    - name: Install locked dependencies
      run: uv sync --group dev --frozen
        
    - name: Run Tests
      env:
        QT_QPA_PLATFORM: offscreen
        PYNPUT_BACKEND: dummy
      run: uv run pytest -m "not slow" -q

  # ============================================================================
  # Windows Build - Creates .exe installer using Inno Setup
  # ============================================================================
  build-windows:
    name: Build Windows Installer
    needs: test
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.ref }}
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        
    - name: Install uv
      uses: astral-sh/setup-uv@v7

    - name: Restore uv cache
      uses: actions/cache@v4
      with:
        path: ~/.cache/uv
        key: uv-${{ runner.os }}-${{ hashFiles('uv.lock') }}
        restore-keys: |
          uv-${{ runner.os }}-
      
    - name: Install locked dependencies
      run: uv sync --group dev --frozen
        
    - name: Build with Briefcase
      run: |
        uv run python scripts/build.py
        
    - name: Debug - Show build output
      run: |
        echo "=== Briefcase output ==="
        Get-ChildItem -Recurse build/sayit/windows/app -ErrorAction SilentlyContinue | Measure-Object -Property Length -Sum
        Get-ChildItem build/sayit/windows/app -Recurse -ErrorAction SilentlyContinue | Sort-Object Length -Descending | Select-Object -First 20

    - name: Create Installer with Inno Setup
      run: iscc /O+ /DMyAppVersion=${{ env.APP_VERSION }} installer.iss
      shell: cmd

    - name: Generate SHA-256 checksum
      shell: pwsh
      run: |
        $exe = Get-ChildItem installer-output/*.exe | Select-Object -First 1
        if (-not $exe) { Write-Error "No installer produced"; exit 1 }
        $hash = (Get-FileHash $exe.FullName -Algorithm SHA256).Hash
        "$hash  $($exe.Name)" | Out-File "$($exe.FullName).sha256" -Encoding ascii
        Write-Host "SHA-256: $hash"
        Write-Host "Size: $([math]::Round($exe.Length/1MB,2)) MB"

    - name: Upload Windows Installer
      uses: actions/upload-artifact@v4
      with:
        name: ${{ env.APP_NAME }}-Windows-Setup
        path: |
          installer-output/*.exe
          installer-output/*.sha256
        if-no-files-found: error

  # ============================================================================
  # Linux x64 Build - Creates AppImage using Briefcase
  # ============================================================================
  build-linux-x64:
    name: Build Linux AppImage (x64)
    needs: test
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.ref }}
    
    - name: Free up disk space
      run: |
        # Remove large unused software to free up ~30GB
        sudo rm -rf /usr/share/dotnet
        sudo rm -rf /usr/local/lib/android
        sudo rm -rf /opt/ghc
        sudo rm -rf /opt/hostedtoolcache/CodeQL
        df -h
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        
    - name: Install uv
      uses: astral-sh/setup-uv@v7

    - name: Restore uv cache
      uses: actions/cache@v4
      with:
        path: ~/.cache/uv
        key: uv-${{ runner.os }}-${{ hashFiles('uv.lock') }}
        restore-keys: |
          uv-${{ runner.os }}-
      
    - name: Install system dependencies
      run: |
        sudo apt-get update
        # Qt/PySide6 runtime libraries are required by icon generation and
        # headless packaging, while libfuse2 is required for AppImage tooling.
        sudo apt-get install -y libegl1 libegl-dev libxkbcommon0 libxcb-xinerama0 libxcb-cursor0 libportaudio2 libfuse2
      
    - name: Install locked dependencies
      run: uv sync --group dev --frozen
        
    - name: Build with Briefcase
      run: |
        uv run python scripts/build.py
        
    - name: Debug - Show build output
      run: |
        echo "=== Briefcase output ==="
        du -sh build/sayit/linux/appimage/ || true
        ls -la build/sayit/linux/appimage/ || true
        find build -name "*.AppImage" 2>/dev/null || true

    - name: Package AppImage
      run: |
        uv run briefcase package linux appimage
        
    - name: Find and rename AppImage
      id: appimage
      run: |
        # Find the generated AppImage
        APPIMAGE=$(find build -name "*.AppImage" -type f | head -1)
        if [ -z "$APPIMAGE" ]; then
          echo "Error: No AppImage found!"
          find build -type f -name "*" | head -50
          exit 1
        fi
        # Bare version without a leading "v" (v0.1.0 -> 0.1.0).
        VERSION="${{ env.APP_VERSION }}"
        VERSION="${VERSION#v}"
        OUT="${{ env.APP_NAME }}-${VERSION}-Linux-x86_64.AppImage"
        echo "Found AppImage: $APPIMAGE -> $OUT"
        cp "$APPIMAGE" "$OUT"
        echo "name=$OUT" >> "$GITHUB_OUTPUT"

    - name: Generate SHA-256 checksum
      run: |
        OUT="${{ steps.appimage.outputs.name }}"
        HASH="$(sha256sum "$OUT" | cut -d' ' -f1)"
        echo "$HASH  $(basename "$OUT")" > "$OUT.sha256"
        cat "$OUT.sha256"

    - name: Upload Linux AppImage
      uses: actions/upload-artifact@v4
      with:
        name: ${{ env.APP_NAME }}-Linux-x64-AppImage
        path: |
          ${{ steps.appimage.outputs.name }}
          ${{ steps.appimage.outputs.name }}.sha256
        if-no-files-found: error

  # ============================================================================
  # Release - Create GitHub Release when a version tag is pushed
  # ============================================================================
  release:
    name: Create Release
    if: ${{ github.event_name == 'release' || startsWith(github.ref, 'refs/tags/v') || (github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[release]')) }}
    needs: [build-windows, build-linux-x64]
    runs-on: ubuntu-latest
    # No 'if' needed - this workflow only runs on release creation
    permissions:
      contents: write
    
    steps:
    - name: Check out the tagged commit
      uses: actions/checkout@v4
      with:
        ref: ${{ github.ref }}

    - name: Set up Node
      uses: actions/setup-node@v4
      with:
        node-version: 22

    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts
        
    - name: Prepare release files
      run: |
        mkdir release-files
        # Find and copy all installer files + checksums
        find artifacts -name "*.exe" -exec cp {} release-files/ \;
        find artifacts -name "*.sha256" -exec cp {} release-files/ \;
        find artifacts -name "*.AppImage" -exec cp {} release-files/ \;
        ls -la release-files/

    # Generates release-manifest.json + checksums.txt from the actual
    # artifacts. The website download center consumes the manifest; this step
    # fails the release when artifacts/checksums/versions are inconsistent.
    - name: Generate release manifest + checksums
      env:
        RELEASE_TAG: ${{ github.event.release.tag_name || env.APP_VERSION }}
        RELEASE_DATE: ${{ github.event.release.created_at }}
      run: |
        node website/scripts/generate-manifest.mjs \
          --tag "$RELEASE_TAG" \
          --repo "${{ github.repository }}" \
          --release-date "$RELEASE_DATE" \
          --release-files release-files \
          --out release-files
        echo "---- release-manifest.json ----"
        cat release-files/release-manifest.json
        echo "---- checksums.txt ----"
        cat release-files/checksums.txt

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v3
      with:
        tag_name: ${{ github.event.release.tag_name || env.APP_VERSION }}
        target_commitish: ${{ github.sha }}
        generate_release_notes: true
        files: release-files/*
        fail_on_unmatched_files: true
        overwrite_files: true
        draft: false
        make_latest: true
